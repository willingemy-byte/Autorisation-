name: AIV Android unsigned build

on:
  push:
    branches:
      - aiv-build-public
  pull_request:
    branches:
      - main
    paths:
      - "aiv/**"
      - ".github/workflows/aiv-build-public.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch containing aiv/AIV-0.6.20-sources-completes.zip"
        required: true
        default: "aiv-build-public"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout AIV build branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack AIV sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q aiv/AIV-0.6.20-sources-completes.zip -d work
          test -f work/aiv-v20/bootstrap-clean-build.sh
          test -f work/aiv-v20/app/src/main/AndroidManifest.xml

      - name: Restore pinned Android toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            work/aiv-v20/.toolchain/downloads
            work/aiv-v20/.toolchain/sdk/platforms/android-35
            work/aiv-v20/.toolchain/sdk/build-tools/35.0.0
            work/aiv-v20/.toolchain/sdk/ndk/27.3.13750724
          key: aiv-android35-r27d-ecj340-v1-${{ runner.os }}

      - name: Build aligned unsigned AIV 0.6.20
        shell: bash
        working-directory: work/aiv-v20
        env:
          AIV_BUILD_MODE: unsigned
        run: |
          set -euo pipefail
          chmod +x bootstrap-clean-build.sh
          ./bootstrap-clean-build.sh
          test -f build/AIV-0.6.20-unsigned.apk

      - name: Verify package/version/alignment before signing
        shell: bash
        working-directory: work/aiv-v20
        run: |
          set -euo pipefail
          APK=build/AIV-0.6.20-unsigned.apk
          AAPT2=.toolchain/sdk/build-tools/35.0.0/aapt2
          ZIPALIGN=.toolchain/sdk/build-tools/35.0.0/zipalign
          "$AAPT2" dump badging "$APK" | tee build/badging-unsigned.txt
          grep -q "package: name='fr.erick.journallocal'" build/badging-unsigned.txt
          grep -q "versionCode='26'" build/badging-unsigned.txt
          grep -q "versionName='0.6.20'" build/badging-unsigned.txt
          "$ZIPALIGN" -c -P 16 4 "$APK"
          sha256sum "$APK" | tee build/AIV-0.6.20-unsigned.apk.sha256
          cp .toolchain/sdk/build-tools/35.0.0/lib/apksigner.jar build/apksigner.jar

      - name: Upload aligned unsigned APK and signer
        uses: actions/upload-artifact@v4
        with:
          name: AIV-0.6.20-unsigned-for-local-signing
          if-no-files-found: error
          retention-days: 30
          path: |
            work/aiv-v20/build/AIV-0.6.20-unsigned.apk
            work/aiv-v20/build/AIV-0.6.20-unsigned.apk.sha256
            work/aiv-v20/build/apksigner.jar
            work/aiv-v20/build/badging-unsigned.txt
